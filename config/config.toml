[dotfiles]
"~/.config/ghostty/config.ghostty" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zshrc" = { mode = "track" }
"~/.zshrc/fpath" = { line = "fpath+=('/Users/longkh/.local/share/zsh/site-functions')", position = "prepend" }
"~/.zshrc/zoxide" = { line = 'eval "$(zoxide init zsh)"' }
"~/.zshrc/aliases" = { block = '''
alias vi='nvim'
alias vim='nvim'
''' }

[bootstrap.services.mise-history]
builtin = "history-watch"

[tools]
"rust" = "latest"
"claude" = "latest"
"cargo:zoxide" = "latest"

[bootstrap.packages]
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:xcodes" = "latest"
"brew:gh" = "latest"
"brew:aria2" = "latest"
"brew:age" = "latest"
"brew:age-plugin-se" = "latest"
"brew:tree-sitter-cli" = "latest"

"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:protonvpn" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:claude" = "latest"

"brew-cask:font-paper-mono" = "latest"

[bootstrap.mise_shell_activate]
zsh = true

[history.encryption]
recipients = [
