[dotfiles]
"~/.config/ghostty/config.ghostty" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zshrc" = { mode = "track" }
"~/.zshrc/aliases" = { block = '''
alias vi='nvim'
alias vim='nvim'
''' }
"~/.zshrc/fpath" = { block = '''
fpath+=('/Users/longkh/.local/share/zsh/site-functions')
fpath+=("$(brew --prefix)/share/zsh/site-functions")
''' }
"~/.zshrc/fpath" = { line = "fpath+=('/Users/longkh/.local/share/zsh/site-functions')", position = "prepend" }
"~/.zshrc/zoxide" = { line = 'eval "$(zoxide init zsh)"' }
"~/.zshrc/zsh-autosuggestions" = { line = 'source $HOMEBREW_PREFIX/share/zsh-autosuggestions/zsh-autosuggestions.zsh' }

[bootstrap.services.mise-history]
builtin = "history-watch"

[tools]
"rust" = "latest"
"node" = "latest"
"go" = "latest"
"python" = "latest"

"uv" = "latest"
"claude" = { version = "latest", minimum_release_age = "6h" }
"stylua" = "latest"

"cargo:zoxide" = "latest"
"npm:oxfmt" = "latest"

[bootstrap.packages]
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:xcodes" = "latest"
"brew:gh" = "latest"
"brew:aria2" = "latest"
"brew:age" = "latest"
"brew:age-plugin-se" = "latest"
"brew:tree-sitter-cli" = "latest"

"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:bitwarden" = "latest"
"brew-cask:protonvpn" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:tailscale-app" = "latest"

"brew-cask:font-paper-mono" = "latest"

[bootstrap.mise_shell_activate]
zsh = true

[history.encryption]
recipients = [
